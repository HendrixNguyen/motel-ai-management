name: PR Checks

on:
  pull_request:
    branches:
      - qa
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Check formatting and lint for changed files only
        run: node scripts/check-changed-files.mjs "${{ github.event.pull_request.base.sha }}"
