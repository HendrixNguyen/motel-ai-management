name: Version Bump

on:
  push:
    branches:
      - qa
      - main
    paths-ignore:
      - "frontend/package.json"
      - "backend/package.json"
      - "frontend/bun.lock"
      - "backend/bun.lock"

permissions:
  contents: write

jobs:
  bump-patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - name: Bump both package versions
        run: node scripts/bump-package-versions.mjs
      - name: Refresh lockfiles without dependency updates
        run: |
          (cd frontend && bun install --lockfile-only --frozen-lockfile)
          (cd backend && bun install --lockfile-only --frozen-lockfile)
      - name: Verify lockfile diffs contain no dependency resolution changes
        run: node scripts/test-lockfile-stability.mjs
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json backend/package.json frontend/bun.lock backend/bun.lock
          if git diff --cached --quiet; then
            echo "No version or lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(release): bump package versions [skip ci]"
          git push
