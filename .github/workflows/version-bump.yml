name: Version Bump

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  bump-patch:
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'qa' || github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure this merge is current target HEAD
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: oven-sh/setup-bun@v2
      - name: Bump both package versions
        run: node scripts/bump-package-versions.mjs
      - name: Refresh lockfiles without dependency updates
        run: |
          (cd frontend && bun install --lockfile-only)
          (cd backend && bun install --lockfile-only)
      - name: Verify lockfile diffs contain no dependency resolution changes
        run: node scripts/lockfile-stability.mjs "${{ github.event.pull_request.merge_commit_sha }}"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json backend/package.json frontend/bun.lock backend/bun.lock
          if git diff --cached --quiet; then
            echo "No version or lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(release): bump package versions [skip ci]"
          git push
