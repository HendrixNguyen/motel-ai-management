services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: motel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motel"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/motel
      TEST_DATABASE_URL: postgres://postgres:password@postgres:5432/motel_test
      NODE_ENV: production
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET:-super_secret_jwt_key_that_is_at_least_32_chars_long}
      RENTER_SESSION_SECRET: ${RENTER_SESSION_SECRET:-super_secret_renter_session_key_at_least_32_chars_long}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-mock_account}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-mock_key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-mock_secret}
      R2_BUCKET: ${R2_BUCKET:-motel-uploads}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-http://localhost:3000/uploads}
      ZALO_OA_ID: ${ZALO_OA_ID:-mock_oa}
      ZALO_OA_SECRET: ${ZALO_OA_SECRET:-mock_secret}
      ZALO_ACCESS_TOKEN: ${ZALO_ACCESS_TOKEN:-mock_token}
      ZALO_WEBHOOK_SECRET: ${ZALO_WEBHOOK_SECRET:-mock_webhook_secret}
      ZNS_TEMPLATE_WELCOME: ${ZNS_TEMPLATE_WELCOME:-PLACEHOLDER}
      ZNS_TEMPLATE_BILL: ${ZNS_TEMPLATE_BILL:-PLACEHOLDER}
      ZNS_TEMPLATE_PAYMENT_CONFIRMED: ${ZNS_TEMPLATE_PAYMENT_CONFIRMED:-PLACEHOLDER}
      ZNS_TEMPLATE_CONTRACT: ${ZNS_TEMPLATE_CONTRACT:-PLACEHOLDER}
      ZNS_TEMPLATE_OTP: ${ZNS_TEMPLATE_OTP:-PLACEHOLDER}
      ZNS_TEMPLATE_EXPIRY: ${ZNS_TEMPLATE_EXPIRY:-PLACEHOLDER}
      ZNS_TEMPLATE_TICKET: ${ZNS_TEMPLATE_TICKET:-PLACEHOLDER}
      RENTER_PORTAL_URL: ${RENTER_PORTAL_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
